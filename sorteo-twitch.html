<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorteo Twitch</title>
<style>
  :root{--bg:#0e0e10;--panel:#18181b;--line:#2f2f35;--txt:#efeff1;--mut:#adadb8;--acc:#9147ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,Segoe UI,Arial,sans-serif}
  header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  header h1{font-size:18px;margin:0 12px 0 0}
  input,select,textarea,button{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit}
  button{cursor:pointer;background:var(--acc);border-color:var(--acc);font-weight:600}
  button.sec{background:var(--panel);border-color:var(--line);font-weight:400}
  button:disabled{opacity:.5;cursor:not-allowed}
  main{display:grid;grid-template-columns:minmax(320px,1fr) minmax(320px,1fr);gap:20px;padding:20px}
  @media(max-width:850px){main{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
  .status{font-size:13px;color:var(--mut)}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#e91916;margin-right:6px}
  .dot.on{background:#00c853}
  #wheelWrap{position:relative;width:100%;max-width:460px;margin:0 auto}
  canvas{width:100%;height:auto;display:block}
  #pointer{position:absolute;left:50%;top:-4px;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:28px solid #fff;filter:drop-shadow(0 2px 3px #000)}
  #winner{text-align:center;font-size:26px;font-weight:700;min-height:40px;margin-top:12px;color:#ffd54a}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--mut);font-weight:500}
  .tablewrap{max-height:380px;overflow:auto;margin-top:8px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
  label{font-size:13px;color:var(--mut)}
  textarea{width:100%;height:56px}
</style>
</head>
<body>
<header>
  <h1>🎁 Sorteo Twitch</h1>
  <input id="channel" placeholder="tu canal (sin #)" size="18">
  <button id="btnConn">Conectar al chat</button>
  <span class="status"><span class="dot" id="dot"></span><span id="stat">Desconectado</span></span>
</header>

<main>
  <section class="card">
    <div id="wheelWrap">
      <div id="pointer"></div>
      <canvas id="wheel" width="600" height="600"></canvas>
    </div>
    <div id="winner"></div>
    <div class="row" style="justify-content:center">
      <button id="btnSpin">🎡 Girar ruleta</button>
      <button class="sec" id="btnElimReset" style="display:none">↺ Reiniciar eliminación</button>
    </div>
    <div id="elimInfo" class="status" style="text-align:center"></div>
  </section>

  <section class="card">
    <div class="row">
      <label>Modalidad:
        <select id="game">
          <option value="win">Ganador directo (el primero que cae gana)</option>
          <option value="elim">Eliminación (cada giro elimina a uno hasta que queda 1)</option>
        </select>
      </label>
    </div>
    <div class="row">
      <label>Cómo contar:
        <select id="mode">
          <option value="day">1 punto por día (máx. 7 en la semana)</option>
          <option value="all">1 punto por cada !sorteo escrito</option>
        </select>
      </label>
    </div>
    <div class="row">
      <label>Semana iniciada: <b id="startLbl">-</b></label>
    </div>
    <label>Excluir usuarios (bots, mods…), separados por coma:</label>
    <textarea id="excl" placeholder="nightbot, streamelements, moobot"></textarea>
    <div class="row">
      <span><b id="nPart">0</b> participantes · <b id="nTix">0</b> tickets</span>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Usuario</th><th>Días</th><th>!sorteo</th><th>Tickets</th><th id="probHead">Prob.</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="row">
      <button class="sec" id="btnExport">Exportar JSON</button>
      <button class="sec" id="btnAdd">Añadir manual</button>
      <button class="sec" id="btnReset">Nueva semana (borrar todo)</button>
    </div>
    <div class="status">Importante: solo registra mientras esta página esté abierta y conectada (ábrela en el navegador o como fuente/dock de OBS durante tus directos).</div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const KEY = 'sorteo_twitch_v1';
let state = load();
state.game = state.game || 'win'; state.elim = state.elim || [];
let ws = null, wantConn = false, reconnTimer = null;
let rot = 0, spinning = false;

function today(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.users) return s; } catch(e){}
  return { start: today(), channel:'', mode:'day', excl:'streamelements, nightbot, moobot, streamlabs', users:{}, game:'win', elim:[] };
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
function excluded(){ return state.excl.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean); }

function tickets(u){ return state.mode === 'day' ? u.days.length : u.count; }
// Peso en la ruleta: ganador directo = tickets; eliminación = 1/tickets (más tickets = más difícil que te eliminen)
function W(x){ return state.game === 'elim' ? 1/x.t : x.t; }
function list(){
  const ex = excluded(), el = state.game === 'elim' ? state.elim : [];
  return Object.entries(state.users)
    .filter(([n]) => !ex.includes(n) && !el.includes(n))
    .map(([n,u]) => ({ name:n, days:u.days.length, count:u.count, t:tickets(u) }))
    .filter(x => x.t > 0)
    .sort((a,b) => b.t - a.t || a.name.localeCompare(b.name));
}

function register(user){
  user = user.toLowerCase();
  if (excluded().includes(user)) return;
  const u = state.users[user] || (state.users[user] = { count:0, days:[] });
  u.count++;
  const d = today();
  if (!u.days.includes(d)) u.days.push(d);
  save(); render();
}

/* ---------- Chat de Twitch (conexión anónima, solo lectura) ---------- */
function connect(){
  const ch = $('channel').value.trim().toLowerCase().replace('#','');
  if (!ch) return alert('Escribe el nombre de tu canal');
  state.channel = ch; save();
  wantConn = true; open(ch);
}
function open(ch){
  clearTimeout(reconnTimer);
  if (ws) { try{ ws.onclose = null; ws.close(); }catch(e){} }
  setStat('Conectando…', false);
  ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  ws.onopen = () => {
    ws.send('PASS SCHMOOPIIE');
    ws.send('NICK justinfan' + Math.floor(10000 + Math.random()*89999));
    ws.send('JOIN #' + ch);
  };
  ws.onmessage = ev => {
    ev.data.split('\r\n').forEach(line => {
      if (!line) return;
      if (line.startsWith('PING')) return ws.send('PONG :tmi.twitch.tv');
      if (line.includes(' 366 ')) setStat('Conectado a #' + ch, true);
      const m = line.match(/:(\w+)!\w+@\w+\.tmi\.twitch\.tv PRIVMSG #\w+ :(.*)$/);
      if (m) {
        const cmd = m[2].trim().toLowerCase().split(/\s+/)[0];
        if (cmd === '!sorteo') register(m[1]);
      }
    });
  };
  ws.onclose = () => {
    setStat('Desconectado' + (wantConn ? ' · reintentando…' : ''), false);
    if (wantConn) reconnTimer = setTimeout(() => open(ch), 4000);
  };
  ws.onerror = () => {};
}
function setStat(t, on){ $('stat').textContent = t; $('dot').className = 'dot' + (on ? ' on' : ''); $('btnConn').textContent = on ? 'Desconectar' : 'Conectar al chat'; }
$('btnConn').onclick = () => {
  if (ws && ws.readyState === 1) { wantConn = false; ws.close(); } else connect();
};

/* ---------- Tabla ---------- */
function render(){
  const L = list(), total = L.reduce((s,x)=>s+x.t,0), wt = L.reduce((s,x)=>s+W(x),0);
  const elim = state.game === 'elim';
  $('probHead').textContent = elim ? 'Prob. eliminación' : 'Prob. ganar';
  $('btnSpin').textContent = elim ? '🎡 Girar y eliminar' : '🎡 Girar ruleta';
  $('btnSpin').disabled = spinning || (elim && L.length <= 1);
  $('btnElimReset').style.display = elim ? '' : 'none';
  $('elimInfo').innerHTML = !elim ? '' : (state.elim.length
    ? 'Eliminados (' + state.elim.length + '): ' + state.elim.map(esc).join(' → ')
    : 'Cada giro elimina a un participante hasta que quede uno');
  $('nPart').textContent = L.length; $('nTix').textContent = total;
  $('startLbl').textContent = state.start;
  $('tbody').innerHTML = L.map(x =>
    `<tr><td>${esc(x.name)}</td><td>${x.days}</td><td>${x.count}</td><td>${x.t}</td><td>${(W(x)/wt*100).toFixed(1)}%</td></tr>`
  ).join('');
  drawWheel();
}
function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- Ruleta ---------- */
const cv = $('wheel'), cx = cv.getContext('2d');
function color(i, n){ return `hsl(${Math.round(i*360/Math.max(n,1)*0.92 + (i%2)*20)},65%,${i%2?45:38}%)`; }
function drawWheel(){
  const L = list(), total = L.reduce((s,x)=>s+W(x),0), R = 290, C = 300;
  cx.clearRect(0,0,600,600);
  cx.save(); cx.translate(C,C);
  if (!L.length) {
    cx.fillStyle = '#26262c'; cx.beginPath(); cx.arc(0,0,R,0,Math.PI*2); cx.fill();
    cx.fillStyle = '#adadb8'; cx.font = '22px system-ui'; cx.textAlign = 'center';
    cx.fillText('Esperando participantes…', 0, 8);
    cx.restore(); return;
  }
  cx.rotate(rot);
  let a = 0;
  L.forEach((x,i) => {
    const w = W(x)/total*Math.PI*2;
    cx.beginPath(); cx.moveTo(0,0); cx.arc(0,0,R,a,a+w); cx.closePath();
    cx.fillStyle = color(i, L.length); cx.fill();
    cx.strokeStyle = '#0e0e10'; cx.lineWidth = 1.5; cx.stroke();
    if (w > 0.07) {
      cx.save(); cx.rotate(a + w/2); cx.textAlign = 'right'; cx.fillStyle = '#fff';
      cx.font = `600 ${Math.max(11, Math.min(22, w*60))}px system-ui`;
      cx.fillText(x.name.slice(0,16), R-14, 6); cx.restore();
    }
    a += w;
  });
  cx.beginPath(); cx.arc(0,0,22,0,Math.PI*2); cx.fillStyle = '#0e0e10'; cx.fill();
  cx.restore();
}
function finish(L, idx){
  spinning = false;
  const name = L[idx].name;
  if (state.game !== 'elim') { $('btnSpin').disabled = false; $('winner').textContent = '🏆 ' + name; return; }
  state.elim.push(name); save();
  if (L.length === 2) {
    const last = L.find(x => x.name !== name);
    $('winner').textContent = '🏆 ' + last.name;
    setTimeout(render, 1200);
  } else {
    $('winner').textContent = '❌ ' + name + ' eliminado';
    setTimeout(render, 1500);
  }
  render();
}
function spin(){
  if (spinning) return;
  const L = list(), total = L.reduce((s,x)=>s+W(x),0);
  if (!L.length) return alert('Todavía no hay participantes');
  if (state.game === 'elim' && L.length === 1) { $('winner').textContent = '🏆 ' + L[0].name; return; }
  // 1) elegir ganador con probabilidad proporcional a sus tickets
  let r = Math.random()*total, idx = 0;
  for (let i=0;i<L.length;i++){ r -= W(L[i]); if (r < 0){ idx = i; break; } }
  // 2) calcular el ángulo para que el ganador quede bajo el puntero (arriba)
  let start = 0; for (let i=0;i<idx;i++) start += W(L[i])/total*Math.PI*2;
  const w = W(L[idx])/total*Math.PI*2;
  const mid = start + w*(0.15 + Math.random()*0.7);
  const TWO = Math.PI*2;
  let target = -Math.PI/2 - mid;
  target = ((target % TWO) + TWO) % TWO;
  const from = ((rot % TWO) + TWO) % TWO;
  const end = from + (6 + Math.floor(Math.random()*3))*TWO + ((target - from + TWO) % TWO);
  spinning = true; $('btnSpin').disabled = true; $('winner').textContent = '';
  const t0 = performance.now(), dur = 7000;
  (function frame(now){
    const p = Math.min((now - t0)/dur, 1), e = 1 - Math.pow(1-p, 4);
    rot = from + (end - from)*e; drawWheel();
    if (p < 1) requestAnimationFrame(frame);
    else finish(L, idx);
  })(t0);
}
$('btnSpin').onclick = spin;

/* ---------- Otros botones ---------- */
$('game').onchange = e => { state.game = e.target.value; save(); $('winner').textContent = ''; render(); };
$('btnElimReset').onclick = () => { if (!confirm('¿Devolver a todos los eliminados a la ruleta?')) return; state.elim = []; save(); $('winner').textContent = ''; render(); };
$('mode').onchange = e => { state.mode = e.target.value; save(); render(); };
$('excl').onchange = e => { state.excl = e.target.value; save(); render(); };
$('btnExport').onclick = () => {
  const b = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'sorteo-' + state.start + '.json'; a.click();
};
$('btnAdd').onclick = () => { const n = prompt('Usuario a añadir (cuenta como 1 !sorteo):'); if (n) register(n.trim().replace('@','')); };
$('btnReset').onclick = () => {
  if (!confirm('¿Borrar todos los registros y empezar una semana nueva?')) return;
  state.users = {}; state.elim = []; state.start = today(); save(); $('winner').textContent = ''; rot = 0; render();
};

$('channel').value = state.channel || '';
$('game').value = state.game; $('mode').value = state.mode; $('excl').value = state.excl;
render();
</script>
</body>
</html>
